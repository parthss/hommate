<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>New chore</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="ds/lumen/components/bundle.css">
<script src="ds/lumen/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--link)}a:hover{color:var(--link)}
button:focus-visible,a:focus-visible{outline:3px solid var(--focus-ring);outline-offset:1px}
.btn-block{width:100%;justify-content:center;box-sizing:border-box}
.seg-full{display:grid;width:100%}
.field-full{max-width:none}
</style>
</helmet>
<div class="{{themeClass}}" style="width: 390px; height: 1400px; display: flex; flex-direction: column; overflow: hidden; background: var(--bg-alt); color: var(--label); font-family: var(--font-text); font-size: 17px; line-height: 25px; letter-spacing: -0.022em; -webkit-font-smoothing: antialiased;">

<header style="flex: none; padding: 50px 8px 8px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; background: var(--nav-glass); -webkit-backdrop-filter: var(--blur-glass); backdrop-filter: var(--blur-glass); border-bottom: 1px solid var(--separator);">
<a href="Chores.dc.html" style="justify-self: start; display: inline-flex; align-items: center; min-height: 44px; padding: 0 8px; text-decoration: none; color: var(--link);">Cancel</a>
<h1 style="margin: 0; font-size: 17px; line-height: 22px; font-weight: 600;">New chore</h1>
<span></span>
</header>

<main style="flex: 1 1 auto; min-height: 0; overflow-y: auto; box-sizing: border-box; padding: 20px 16px 24px; display: flex; flex-direction: column; gap: 20px;">

<x-import component-from-global-scope="Lumen.TextField" label="Chore name" default-value="Clean bathroom" class-name="field-full"></x-import>

<section aria-labelledby="ac-repeat" style="display: flex; flex-direction: column; gap: 8px;">
<h2 id="ac-repeat" style="margin: 0; padding: 0 6px; font-size: 14px; line-height: 20px; font-weight: 400; color: var(--label-secondary);">How often</h2>
<div style="background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); padding: 12px; display: flex; flex-direction: column; gap: 14px;">
<x-import component-from-global-scope="Lumen.SegmentedControl" variant="inset" label="How often" options="{{repeatOpts}}" value="{{repeat}}" on-change="{{setRepeat}}" class-name="seg-full"></x-import>
<sc-if value="{{showDays}}" hint-placeholder-val="{{true}}">
<div role="group" aria-label="{{daysLabel}}" style="display: grid; grid-template-columns: repeat(7, 44px); justify-content: space-between;">
<sc-for list="{{days}}" as="d" hint-placeholder-count="7">
<button type="button" onClick="{{d.pick}}" aria-pressed="{{d.on}}" aria-label="{{d.name}}" style="width: 44px; height: 44px; border-radius: 50%; border: 0; padding: 0; cursor: pointer; font-size: 15px; font-weight: {{d.weight}}; background: {{d.bg}}; color: {{d.color}};">{{d.l}}</button>
</sc-for>
</div>
</sc-if>
<p style="margin: 0; padding: 0 4px; font-size: 14px; line-height: 20px; letter-spacing: -0.016em; color: var(--label-secondary);">{{repeatSummary}}</p>
</div>
</section>

<section aria-labelledby="ac-who" style="display: flex; flex-direction: column; gap: 8px;">
<h2 id="ac-who" style="margin: 0; padding: 0 6px; font-size: 14px; line-height: 20px; font-weight: 400; color: var(--label-secondary);">Who does it</h2>
<div role="group" aria-labelledby="ac-who" style="background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); padding: 0 16px; display: flex; flex-direction: column;">
<sc-for list="{{modes}}" as="m" hint-placeholder-count="3">
<button type="button" onClick="{{m.pick}}" aria-pressed="{{m.on}}" style="display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 10px 0; border: 0; border-top: {{m.border}}; background: none; color: var(--label); text-align: left; font: inherit; cursor: pointer;">
<span style="flex: 1 1 auto; display: flex; flex-direction: column;">
<span style="font-weight: 600;">{{m.title}}</span>
<span style="font-size: 14px; line-height: 20px; letter-spacing: -0.016em; color: var(--label-secondary);">{{m.desc}}</span>
</span>
<span aria-hidden="true" style="flex: none; width: 24px; height: 24px; border-radius: 50%; box-sizing: border-box; border: {{m.ring}}; background: {{m.fill}}; color: var(--on-accent); display: flex; align-items: center; justify-content: center;">
<sc-if value="{{m.on}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg></sc-if>
</span>
</button>
</sc-for>
</div>
</section>

<sc-if value="{{isTurns}}" hint-placeholder-val="{{true}}">
<section aria-labelledby="ac-order" style="display: flex; flex-direction: column; gap: 8px;">
<h2 id="ac-order" style="margin: 0; padding: 0 6px; font-size: 14px; line-height: 20px; font-weight: 400; color: var(--label-secondary);">Rotation order</h2>
<ol style="list-style: none; margin: 0; background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); padding: 0 16px 0 4px; display: flex; flex-direction: column;">
<sc-for list="{{people}}" as="p" hint-placeholder-count="4">
<li style="display: flex; align-items: center; gap: 8px; min-height: 60px; border-top: {{p.border}};">
<button type="button" aria-label="{{p.dragLabel}}" style="flex: none; width: 36px; height: 44px; border: 0; background: none; padding: 0; color: var(--label-tertiary); cursor: grab; display: flex; align-items: center; justify-content: center;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M5 8h14M5 12h14M5 16h14"></path></svg>
</button>
<span style="flex: none; width: 22px; font-size: 14px; line-height: 20px; font-weight: 600; color: var(--label-secondary); text-align: center;">{{p.pos}}</span>
<span aria-hidden="true" style="flex: none; width: 32px; height: 32px; border-radius: 50%; background: {{p.c}}; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; opacity: {{p.fade}};">{{p.i}}</span>
<x-import component-from-global-scope="Lumen.Switch" label="{{p.name}}" checked="{{p.on}}" on-change="{{p.flip}}" full-width="{{yes}}" style="flex: 1 1 auto; min-width: 0;"></x-import>
</li>
</sc-for>
</ol>
<p style="margin: 0; padding: 0 6px; font-size: 14px; line-height: 20px; letter-spacing: -0.016em; color: var(--label-secondary);">{{rotationNote}}</p>
</section>
</sc-if>

<sc-if value="{{isOne}}" hint-placeholder-val="{{false}}">
<section aria-labelledby="ac-person" style="display: flex; flex-direction: column; gap: 8px;">
<h2 id="ac-person" style="margin: 0; padding: 0 6px; font-size: 14px; line-height: 20px; font-weight: 400; color: var(--label-secondary);">Person</h2>
<div role="group" aria-labelledby="ac-person" style="background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); padding: 16px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px;">
<sc-for list="{{owners}}" as="o" hint-placeholder-count="4">
<button type="button" onClick="{{o.pick}}" aria-pressed="{{o.on}}" style="display: flex; flex-direction: column; align-items: center; gap: 6px; border: 0; background: none; padding: 4px 0; cursor: pointer; color: var(--label); font: inherit; font-size: 14px; line-height: 20px;">
<span aria-hidden="true" style="width: 44px; height: 44px; border-radius: 50%; background: {{o.c}}; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600; box-shadow: {{o.ring}};">{{o.i}}</span>
<span style="font-weight: {{o.weight}};">{{o.name}}</span>
</button>
</sc-for>
</div>
</section>
</sc-if>

<section aria-labelledby="ac-when" style="display: flex; flex-direction: column; gap: 8px;">
<h2 id="ac-when" style="margin: 0; padding: 0 6px; font-size: 14px; line-height: 20px; font-weight: 400; color: var(--label-secondary);">Timing</h2>
<div style="background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); padding: 0 12px 0 16px; display: flex; flex-direction: column;">
<button type="button" style="display: flex; align-items: center; gap: 8px; min-height: 52px; border: 0; background: none; padding: 0; color: var(--label); font: inherit; cursor: pointer; text-align: left;">
<span style="flex: 1 1 auto;">Starts</span>
<span style="color: var(--label-secondary);">Tue 6 October</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--label-tertiary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 5.5 16 12l-6.5 6.5"></path></svg>
</button>
<button type="button" style="display: flex; align-items: center; gap: 8px; min-height: 52px; border: 0; border-top: 1px solid var(--separator); background: none; padding: 0; color: var(--label); font: inherit; cursor: pointer; text-align: left;">
<span style="flex: 1 1 auto;">Due by</span>
<span style="color: var(--label-secondary);">9:00 pm</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--label-tertiary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 5.5 16 12l-6.5 6.5"></path></svg>
</button>
<button type="button" style="display: flex; align-items: center; gap: 8px; min-height: 52px; border: 0; border-top: 1px solid var(--separator); background: none; padding: 0; color: var(--label); font: inherit; cursor: pointer; text-align: left;">
<span style="flex: 1 1 auto;">Reminder</span>
<span style="color: var(--label-secondary);">1 hour before</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--label-tertiary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 5.5 16 12l-6.5 6.5"></path></svg>
</button>
</div>
</section>

</main>
<footer style="flex: none; padding: 12px 16px 34px; background: var(--nav-glass); -webkit-backdrop-filter: var(--blur-glass); backdrop-filter: var(--blur-glass); border-top: 1px solid var(--separator); display: flex; flex-direction: column;">
<x-import component-from-global-scope="Lumen.Button" variant="primary" size="large" class-name="btn-block" href="ChoreDetail.dc.html">Save chore</x-import>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Theme"},"$preview":{"width":390,"height":1400}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const repeat = s.repeat || 'custom';
    const mode = s.mode || 'turns';
    const owner = s.owner || 'maya';
    const picked = s.days || { tue: true, sat: true };
    const incl = s.incl || { maya: true, leo: true, sam: true, raj: false };
    const dayDefs = [
      ['mon', 'M', 'Monday'], ['tue', 'T', 'Tuesday'], ['wed', 'W', 'Wednesday'], ['thu', 'T', 'Thursday'],
      ['fri', 'F', 'Friday'], ['sat', 'S', 'Saturday'], ['sun', 'S', 'Sunday']
    ];
    const days = dayDefs.map((d) => {
      const on = !!picked[d[0]];
      return {
        l: d[1], name: d[2], on: on,
        bg: on ? 'var(--accent)' : 'var(--fill)',
        color: on ? 'var(--on-accent)' : 'var(--label)',
        weight: on ? 600 : 400,
        pick: () => {
          const next = repeat === 'weekly' ? { [d[0]]: true } : Object.assign({}, picked, { [d[0]]: !on });
          this.setState({ days: next });
        }
      };
    });
    const onNames = dayDefs.filter((d) => picked[d[0]]).map((d) => d[2] + 's');
    const listText = onNames.length === 0 ? 'no days yet' : onNames.length === 1 ? onNames[0] : onNames.slice(0, -1).join(', ') + ' and ' + onNames[onNames.length - 1];
    const repeatSummary = repeat === 'once' ? 'Happens once, on the start date below.'
      : repeat === 'daily' ? 'Every day.'
      : repeat === 'weekly' ? 'Every week on ' + (onNames[0] || 'the day you pick') + '.'
      : 'Every ' + listText + '.';

    const modeDefs = [
      { id: 'one', title: 'One person', desc: 'Always the same housemate.' },
      { id: 'turns', title: 'Take turns', desc: 'Rotates between the people you pick.' },
      { id: 'claim', title: 'Anyone can claim', desc: 'Sits in Unclaimed until someone takes it.' }
    ];
    const modes = modeDefs.map((m, i) => ({
      title: m.title, desc: m.desc, on: m.id === mode,
      border: i === 0 ? 'none' : '1px solid var(--separator)',
      ring: m.id === mode ? '0 solid transparent' : '1.5px solid var(--border-control)',
      fill: m.id === mode ? 'var(--accent)' : 'transparent',
      pick: () => this.setState({ mode: m.id })
    }));

    const P = [
      { id: 'maya', name: 'Maya (you)', i: 'M', c: 'var(--av-maya)' },
      { id: 'leo', name: 'Leo', i: 'L', c: 'var(--av-leo)' },
      { id: 'sam', name: 'Sam', i: 'S', c: 'var(--av-sam)' },
      { id: 'raj', name: 'Raj', i: 'R', c: 'var(--av-raj)' }
    ];
    let n = 0;
    const ord = ['1st', '2nd', '3rd', '4th'];
    const people = P.map((p, idx) => {
      const on = !!incl[p.id];
      const pos = on ? ord[n++] : '–';
      return Object.assign({}, p, {
        on: on, pos: pos, fade: on ? 1 : 0.42,
        border: idx === 0 ? 'none' : '1px solid var(--separator)',
        dragLabel: 'Reorder ' + p.name,
        flip: (v) => this.setState({ incl: Object.assign({}, incl, { [p.id]: v }) })
      });
    });
    const inRota = people.filter((p) => p.on);
    const rotationNote = inRota.length < 2
      ? 'Pick at least two people to take turns.'
      : inRota[0].name.replace(' (you)', '') + ' starts. Drag to change the order.';
    const owners = P.map((p) => ({
      name: p.name.replace(' (you)', ''), i: p.i, c: p.c, on: p.id === owner,
      ring: p.id === owner ? '0 0 0 3px var(--surface), 0 0 0 5px var(--label)' : 'none',
      weight: p.id === owner ? 600 : 400,
      pick: () => this.setState({ owner: p.id })
    }));

    return {
      themeClass: this.props.dark ? 'lm-dark' : 'lm-light',
      yes: true,
      repeatOpts: [{ label: 'Once', value: 'once' }, { label: 'Daily', value: 'daily' }, { label: 'Weekly', value: 'weekly' }, { label: 'Custom', value: 'custom' }],
      repeat: repeat,
      setRepeat: (v) => this.setState({ repeat: v, days: v === 'weekly' ? { tue: true } : picked }),
      showDays: repeat === 'weekly' || repeat === 'custom',
      daysLabel: repeat === 'weekly' ? 'Day of the week' : 'Days of the week',
      days: days,
      repeatSummary: repeatSummary,
      modes: modes,
      isTurns: mode === 'turns',
      isOne: mode === 'one',
      people: people,
      rotationNote: rotationNote,
      owners: owners
    };
  }
}
</script>
</body>
</html>
