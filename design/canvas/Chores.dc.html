<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Chores</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="ds/lumen/components/bundle.css">
<script src="ds/lumen/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--link)}a:hover{color:var(--link)}
button:focus-visible,a:focus-visible{outline:3px solid var(--focus-ring);outline-offset:1px}
.seg-full{display:grid;width:100%}
</style>
</helmet>
<div class="{{themeClass}}" style="width: 390px; height: 1000px; display: flex; flex-direction: column; overflow: hidden; background: var(--bg-alt); color: var(--label); font-family: var(--font-text); font-size: 17px; line-height: 25px; letter-spacing: -0.022em; -webkit-font-smoothing: antialiased;">
<main style="flex: 1 1 auto; min-height: 0; overflow-y: auto; box-sizing: border-box; padding: 58px 16px 24px; display: flex; flex-direction: column; gap: 12px;">

<header style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 6px 4px;">
<h1 style="margin: 0; font-family: var(--font-display); font-size: 32px; line-height: 36px; font-weight: 600; letter-spacing: 0.004em;">Chores</h1>
<div style="display: flex; align-items: center; gap: 8px;">
<a href="Rota.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 8px; text-decoration: none; color: var(--link);">Rota</a>
<a href="AddChore.dc.html" aria-label="Add a chore" style="width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: flex; align-items: center; justify-content: center;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
</a>
</div>
</header>

<x-import component-from-global-scope="Lumen.SegmentedControl" variant="inset" label="Show chores" options="{{filters}}" value="{{filter}}" on-change="{{setFilter}}" class-name="seg-full"></x-import>

<sc-if value="{{showHint}}" hint-placeholder-val="{{true}}">
<p style="margin: 0; padding: 0 6px; font-size: 12px; line-height: 16px; color: var(--label-secondary);">Tap the circle, or swipe a chore left, to mark it done.</p>
</sc-if>
<sc-if value="{{showUnclaimedNote}}" hint-placeholder-val="{{false}}">
<p style="margin: 0; padding: 0 6px; font-size: 12px; line-height: 16px; color: var(--label-secondary);">Anyone can take these. Claiming one adds it to your list.</p>
</sc-if>

<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<section aria-label="{{g.label}}" style="background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); padding: 14px 12px 2px 8px; display: flex; flex-direction: column;">
<div style="padding: 0 4px 4px 8px; display: flex; align-items: center; justify-content: space-between; gap: 8px;">
<sc-if value="{{g.overdue}}" hint-placeholder-val="{{false}}"><x-import component-from-global-scope="Lumen.Badge" tone="danger">Overdue</x-import></sc-if>
<sc-if value="{{g.plain}}" hint-placeholder-val="{{true}}"><h2 style="margin: 0; font-size: 17px; line-height: 21px; font-weight: 600;">{{g.label}}</h2></sc-if>
<span style="font-size: 12px; line-height: 16px; color: var(--label-secondary);">{{g.count}}</span>
</div>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column;">
<sc-for list="{{g.items}}" as="c" hint-placeholder-count="2">
<li style="position: relative; overflow: hidden; border-top: {{c.border}};">
<sc-if value="{{c.swiped}}" hint-placeholder-val="{{false}}">
<button type="button" onClick="{{c.toggle}}" style="position: absolute; top: 0; right: -12px; bottom: 0; width: 100px; border: 0; padding: 0 12px 0 0; background: var(--success); color: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; line-height: 16px; font-weight: 600; cursor: pointer;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg>
Done
</button>
</sc-if>
<div style="position: relative; display: flex; align-items: center; gap: 6px; min-height: 64px; background: var(--surface); transform: {{c.shift}};">
<sc-if value="{{c.claimable}}" hint-placeholder-val="{{false}}">
<span style="flex: none; width: 8px;"></span>
</sc-if>
<sc-if value="{{c.checkable}}" hint-placeholder-val="{{true}}">
<button type="button" onClick="{{c.toggle}}" aria-label="{{c.aria}}" aria-pressed="{{c.done}}" style="flex: none; width: 44px; height: 44px; border: 0; background: none; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--bg);">
<span style="width: 26px; height: 26px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid {{c.ringBorder}}; background: {{c.ringBg}}; display: flex; align-items: center; justify-content: center;">
<sc-if value="{{c.done}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg></sc-if>
</span>
</button>
</sc-if>
<a href="ChoreDetail.dc.html" style="flex: 1 1 auto; min-width: 0; min-height: 52px; display: flex; flex-direction: column; justify-content: center; text-decoration: none; color: inherit;">
<span style="font-weight: 600; text-decoration: {{c.deco}}; color: {{c.titleColor}};">{{c.title}}</span>
<span style="display: flex; align-items: center; gap: 5px; font-size: 14px; line-height: 20px; letter-spacing: -0.016em; color: {{c.metaColor}};">
<span>{{c.when}}</span>
<span aria-hidden="true">·</span>
<sc-if value="{{c.repeats}}" hint-placeholder-val="{{true}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-label="Repeats"><path d="m17 2.5 3 3-3 3"></path><path d="M4 11.5v-2a4 4 0 0 1 4-4h12"></path><path d="m7 21.5-3-3 3-3"></path><path d="M20 12.5v2a4 4 0 0 1-4 4H4"></path></svg></sc-if>
<span>{{c.repeat}}</span>
</span>
</a>
<sc-if value="{{c.claimable}}" hint-placeholder-val="{{false}}">
<x-import component-from-global-scope="Lumen.Button" variant="secondary" size="small" on-click="{{c.claim}}">Claim</x-import>
</sc-if>
<sc-if value="{{c.hasWho}}" hint-placeholder-val="{{true}}">
<span role="img" aria-label="{{c.whoName}}" style="flex: none; width: 30px; height: 30px; border-radius: 50%; background: {{c.whoColor}}; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600;">{{c.whoInitial}}</span>
</sc-if>
</div>
</li>
</sc-for>
</ul>
</section>
</sc-for>

</main>

<nav aria-label="Main" style="flex: none; height: 83px; box-sizing: border-box; padding: 6px 8px 34px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--nav-glass); -webkit-backdrop-filter: var(--blur-glass); backdrop-filter: var(--blur-glass); border-top: 1px solid var(--separator);">
<a href="Today.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 44px; text-decoration: none; color: var(--label-secondary); font-size: 12px; line-height: 16px;">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path><circle cx="12" cy="15" r="1.5"></circle></svg>
<span>Today</span>
</a>
<a href="Chores.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 44px; text-decoration: none; color: var(--link); font-size: 12px; line-height: 16px; font-weight: 600;">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 7 2 2 3.5-3.5M12 7.5h8M4 16l2 2 3.5-3.5M12 16.5h8"></path></svg>
<span>Chores</span>
</a>
<a href="Expenses.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 44px; text-decoration: none; color: var(--label-secondary); font-size: 12px; line-height: 16px;">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5h12v17l-2-1.5-2 1.5-2-1.5-2 1.5-2-1.5-2 1.5z"></path><path d="M9 8.5h6M9 12h6M9 15.5h3"></path></svg>
<span>Expenses</span>
</a>
<a href="House.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 44px; text-decoration: none; color: var(--label-secondary); font-size: 12px; line-height: 16px;">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20H4z"></path><path d="M10 20v-5h4v5"></path></svg>
<span>House</span>
</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Theme"},"filter":{"editor":"enum","options":["mine","all","unclaimed"],"default":"mine","section":"State"},"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const filter = s.filter || this.props.filter || 'mine';
    const done = s.done || { dish: true };
    const claimed = s.claimed || {};
    const P = {
      maya: { name: 'Maya (you)', i: 'M', c: 'var(--av-maya)' },
      sam: { name: 'Sam', i: 'S', c: 'var(--av-sam)' },
      raj: { name: 'Raj', i: 'R', c: 'var(--av-raj)' },
      leo: { name: 'Leo', i: 'L', c: 'var(--av-leo)' }
    };
    const all = [
      { id: 'bins', title: 'Take bins out', who: 'maya', when: 'Sun 8:00 pm', repeat: 'Weekly, takes turns', group: 'overdue' },
      { id: 'dish', title: 'Empty dishwasher', who: 'maya', when: 'Today 9:00 am', repeat: 'Daily, takes turns', group: 'today' },
      { id: 'hoover', title: 'Hoover living room', who: 'maya', when: 'Today 7:00 pm', repeat: 'Weekly', group: 'today', swiped: true },
      { id: 'plants', title: 'Water the plants', who: 'maya', when: 'Today 8:00 pm', repeat: 'Mon, Thu', group: 'today' },
      { id: 'bath', title: 'Clean bathroom', who: 'maya', when: 'Tue 9:00 pm', repeat: 'Weekly, takes turns', group: 'week' },
      { id: 'recycle', title: 'Put recycling out', who: 'sam', when: 'Wed 7:00 pm', repeat: 'Weekly, takes turns', group: 'week' },
      { id: 'kitchen', title: 'Wipe down kitchen', who: 'maya', when: 'Thu 9:00 pm', repeat: 'Weekly', group: 'week' },
      { id: 'fridge', title: 'Clear out the fridge', who: 'raj', when: 'Fri, anytime', repeat: 'Monthly', group: 'week' },
      { id: 'stairs', title: 'Hoover stairs', who: 'leo', when: 'Sat, anytime', repeat: 'Weekly', group: 'week' },
      { id: 'mop', title: 'Mop kitchen floor', who: 'maya', when: 'Sat, anytime', repeat: 'One-off', group: 'week' },
      { id: 'kettle', title: 'Descale the kettle', who: null, when: 'This week', repeat: 'One-off', group: 'week' },
      { id: 'freezer', title: 'Defrost the freezer', who: null, when: 'By Sun', repeat: 'One-off', group: 'week' }
    ].map((c) => (claimed[c.id] ? Object.assign({}, c, { who: 'maya' }) : c));

    const keep = (c) => filter === 'all' ? true : filter === 'mine' ? c.who === 'maya' : c.who === null;
    const shape = (c, idx) => {
      const d = !!done[c.id];
      const p = c.who ? P[c.who] : null;
      const mine = c.who === 'maya';
      const overdue = c.group === 'overdue' && !d;
      return Object.assign({}, c, {
        done: d,
        border: idx === 0 ? 'none' : '1px solid var(--separator)',
        checkable: !!c.who,
        claimable: !c.who,
        hasWho: !!p,
        whoName: p ? p.name : '',
        whoInitial: p ? p.i : '',
        whoColor: p ? p.c : 'transparent',
        repeats: c.repeat !== 'One-off',
        swiped: !!c.swiped && !d && filter !== 'unclaimed',
        shift: (c.swiped && !d && filter !== 'unclaimed') ? 'translateX(-88px)' : 'none',
        toggle: () => this.setState({ done: Object.assign({}, done, { [c.id]: !d }) }),
        claim: () => this.setState({ claimed: Object.assign({}, claimed, { [c.id]: true }) }),
        aria: (d ? 'Mark ' + c.title + ' as not done' : 'Mark ' + c.title + ' as done') + (mine ? '' : ' for ' + (p ? p.name : '')),
        ringBorder: d ? 'var(--success)' : overdue ? 'var(--danger)' : 'var(--border-control)',
        ringBg: d ? 'var(--success)' : 'transparent',
        deco: d ? 'line-through' : 'none',
        titleColor: d ? 'var(--label-secondary)' : 'var(--label)',
        metaColor: overdue ? 'var(--danger)' : 'var(--label-secondary)',
        when: d ? 'Done' : c.when
      });
    };
    const defs = filter === 'unclaimed'
      ? [{ key: 'week', label: 'Up for grabs' }]
      : [{ key: 'overdue', label: 'Overdue' }, { key: 'today', label: 'Today' }, { key: 'week', label: 'Later this week' }];
    const groups = defs.map((g) => {
      const items = all.filter((c) => c.group === g.key && keep(c)).map(shape);
      const n = items.length;
      return { label: g.label, overdue: g.key === 'overdue', plain: g.key !== 'overdue', items: items, count: n + (n === 1 ? ' chore' : ' chores') };
    }).filter((g) => g.items.length > 0);

    return {
      themeClass: this.props.dark ? 'lm-dark' : 'lm-light',
      filters: [{ label: 'Mine', value: 'mine' }, { label: 'All', value: 'all' }, { label: 'Unclaimed', value: 'unclaimed' }],
      filter: filter,
      setFilter: (v) => this.setState({ filter: v }),
      showHint: filter !== 'unclaimed',
      showUnclaimedNote: filter === 'unclaimed',
      groups: groups
    };
  }
}
</script>
</body>
</html>
