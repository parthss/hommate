<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>House issues</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="ds/lumen/components/bundle.css">
<script src="ds/lumen/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--link)}a:hover{color:var(--link)}
button:focus-visible,a:focus-visible{outline:3px solid var(--focus-ring);outline-offset:1px}
.seg-full{display:grid;width:100%}
</style>
</helmet>
<div class="{{themeClass}}" style="width: 390px; height: 1100px; display: flex; flex-direction: column; overflow: hidden; background: var(--bg-alt); color: var(--label); font-family: var(--font-text); font-size: 17px; line-height: 25px; letter-spacing: -0.022em; -webkit-font-smoothing: antialiased;">
<main style="flex: 1 1 auto; min-height: 0; overflow-y: auto; box-sizing: border-box; padding: 50px 16px 24px; display: flex; flex-direction: column; gap: 12px;">

<a href="Today.dc.html" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 2px; min-height: 44px; text-decoration: none; color: var(--link);">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"></path></svg>
Today
</a>
<header style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 0 6px 4px;">
<div style="display: flex; flex-direction: column; gap: 2px;">
<h1 style="margin: 0; font-family: var(--font-display); font-size: 32px; line-height: 36px; font-weight: 600; letter-spacing: 0.004em;">House issues</h1>
<p style="margin: 0; font-size: 14px; line-height: 20px; letter-spacing: -0.016em; color: var(--label-secondary);">Things that need sorting. Everyone in the house can see them.</p>
</div>
<a href="ReportIssue.dc.html" aria-label="Report an issue" style="flex: none; width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: flex; align-items: center; justify-content: center;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
</a>
</header>

<x-import component-from-global-scope="Lumen.SegmentedControl" variant="inset" label="Show issues" options="{{tabs}}" value="{{tab}}" on-change="{{setTab}}" class-name="seg-full"></x-import>

<sc-for list="{{items}}" as="it" hint-placeholder-count="3">
<a href="{{it.href}}" style="background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: inherit;">
<span style="display: flex; align-items: center; gap: 8px;">
<span aria-hidden="true" style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: {{it.iconBg}}; color: {{it.iconFg}}; display: flex; align-items: center; justify-content: center;">
<sc-if value="{{it.tNow}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg></sc-if>
<sc-if value="{{it.tProperly}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 9.5A8 8 0 1 1 4 14"></path><path d="M4 4.5v5h5"></path></svg></sc-if>
<sc-if value="{{it.tSmell}}" hint-placeholder-val="{{true}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 20c0-2 2-2.5 2-4.5S8 13 8 11M12 20c0-2 2-2.5 2-4.5S12 13 12 11M16 20c0-2 2-2.5 2-4.5S16 13 16 11"></path><path d="M6 7.5h12"></path></svg></sc-if>
</span>
<span style="flex: 1 1 auto; font-size: 12px; line-height: 16px; color: var(--label-secondary);">{{it.typeLabel}}</span>
<sc-if value="{{it.resolved}}" hint-placeholder-val="{{false}}"><x-import component-from-global-scope="Lumen.Badge" tone="success">Resolved</x-import></sc-if>
<sc-if value="{{it.open}}" hint-placeholder-val="{{true}}"><span style="font-size: 12px; line-height: 16px; font-weight: 600; color: {{it.statusColor}};">{{it.status}}</span></sc-if>
</span>
<span style="font-weight: 600;">{{it.title}}</span>
<span style="display: flex; align-items: center; gap: 8px; font-size: 14px; line-height: 20px; letter-spacing: -0.016em; color: var(--label-secondary);">
<span aria-hidden="true" style="flex: none; width: 22px; height: 22px; border-radius: 50%; background: {{it.byC}}; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600;">{{it.byI}}</span>
<span style="flex: 1 1 auto;">{{it.meta}}</span>
<sc-if value="{{it.forYou}}" hint-placeholder-val="{{false}}"><x-import component-from-global-scope="Lumen.Badge" tone="neutral">For you</x-import></sc-if>
</span>
<span style="display: flex; gap: 14px; font-size: 12px; line-height: 16px; color: var(--label-secondary);">
<span>{{it.replies}}</span>
<sc-if value="{{it.hasAgree}}" hint-placeholder-val="{{false}}"><span>{{it.agree}}</span></sc-if>
</span>
</a>
</sc-for>

</main>

<nav aria-label="Main" style="flex: none; height: 83px; box-sizing: border-box; padding: 6px 8px 34px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--nav-glass); -webkit-backdrop-filter: var(--blur-glass); backdrop-filter: var(--blur-glass); border-top: 1px solid var(--separator);">
<a href="Today.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 44px; text-decoration: none; color: var(--link); font-size: 12px; line-height: 16px; font-weight: 600;">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path><circle cx="12" cy="15" r="1.5"></circle></svg>
<span>Today</span>
</a>
<a href="Chores.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 44px; text-decoration: none; color: var(--label-secondary); font-size: 12px; line-height: 16px;">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 7 2 2 3.5-3.5M12 7.5h8M4 16l2 2 3.5-3.5M12 16.5h8"></path></svg>
<span>Chores</span>
</a>
<a href="Expenses.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 44px; text-decoration: none; color: var(--label-secondary); font-size: 12px; line-height: 16px;">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5h12v17l-2-1.5-2 1.5-2-1.5-2 1.5-2-1.5-2 1.5z"></path><path d="M9 8.5h6M9 12h6M9 15.5h3"></path></svg>
<span>Expenses</span>
</a>
<a href="House.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 44px; text-decoration: none; color: var(--label-secondary); font-size: 12px; line-height: 16px;">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20H4z"></path><path d="M10 20v-5h4v5"></path></svg>
<span>House</span>
</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Theme"},"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const tab = s.tab || 'open';
    const P = {
      maya: { n: 'You', i: 'M', c: 'var(--av-maya)' },
      sam: { n: 'Sam', i: 'S', c: 'var(--av-sam)' },
      raj: { n: 'Raj', i: 'R', c: 'var(--av-raj)' },
      leo: { n: 'Leo', i: 'L', c: 'var(--av-leo)' }
    };
    const types = {
      now: { label: 'Needs doing now', bg: 'var(--danger-tint)', fg: 'var(--danger)' },
      properly: { label: 'Not done properly', bg: 'var(--bg-alt)', fg: 'var(--label-secondary)' },
      smell: { label: 'Mess or smell', bg: 'var(--bg-alt)', fg: 'var(--label-secondary)' }
    };
    const all = [
      { type: 'now', title: 'Bins are overflowing', by: 'sam', to: 'You', when: '25 min ago', replies: 1, agree: 1, status: 'Open', forYou: true, state: 'open', href: 'Issues.dc.html' },
      { type: 'smell', title: 'Microwave smells of old curry', by: 'leo', to: 'Everyone', when: 'Yesterday', replies: 3, agree: 2, status: 'Raj is on it', state: 'open', href: 'IssueDetail.dc.html' },
      { type: 'properly', title: 'Crumbs left all over the stairs', by: 'raj', to: 'Leo', when: 'Yesterday', replies: 1, agree: 0, status: 'Open', state: 'open', href: 'Issues.dc.html' },
      { type: 'smell', title: 'Sticky fridge shelf', by: 'sam', to: 'Everyone', when: 'Fri 2 Oct', replies: 2, agree: 1, status: 'Resolved', state: 'resolved', href: 'Issues.dc.html' },
      { type: 'properly', title: 'Bathroom bin not emptied', by: 'maya', to: 'Leo', when: 'Tue 29 Sep', replies: 1, agree: 0, status: 'Resolved', state: 'resolved', href: 'Issues.dc.html' }
    ];
    const items = all.filter((x) => x.state === tab).map((x) => {
      const t = types[x.type];
      const p = P[x.by];
      return {
        title: x.title, href: x.href,
        typeLabel: t.label, iconBg: t.bg, iconFg: t.fg,
        tNow: x.type === 'now', tProperly: x.type === 'properly', tSmell: x.type === 'smell',
        open: x.state === 'open', resolved: x.state === 'resolved',
        status: x.status,
        statusColor: x.status === 'Open' ? 'var(--label-secondary)' : 'var(--link)',
        byI: p.i, byC: p.c,
        meta: p.n + ' · for ' + (x.to === 'You' ? 'you' : x.to) + ' · ' + x.when,
        forYou: !!x.forYou && x.state === 'open',
        replies: x.replies + (x.replies === 1 ? ' reply' : ' replies'),
        hasAgree: x.agree > 0,
        agree: x.agree + (x.agree === 1 ? ' agrees' : ' agree')
      };
    });
    return {
      themeClass: this.props.dark ? 'lm-dark' : 'lm-light',
      tabs: [{ label: 'Open · 3', value: 'open' }, { label: 'Resolved', value: 'resolved' }],
      tab: tab,
      setTab: (v) => this.setState({ tab: v }),
      items: items
    };
  }
}
</script>
</body>
</html>
