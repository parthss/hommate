<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Create a house</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="ds/lumen/components/bundle.css">
<script src="ds/lumen/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--link)}a:hover{color:var(--link)}
button:focus-visible,a:focus-visible{outline:3px solid var(--focus-ring);outline-offset:1px}
.btn-block{width:100%;justify-content:center;box-sizing:border-box}
.field-full{max-width:none}
</style>
</helmet>
<div class="{{themeClass}}" style="width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden; background: var(--bg-alt); color: var(--label); font-family: var(--font-text); font-size: 17px; line-height: 25px; letter-spacing: -0.022em; -webkit-font-smoothing: antialiased;">
<main style="flex: 1 1 auto; min-height: 0; box-sizing: border-box; padding: 50px 24px 16px; display: flex; flex-direction: column; gap: 24px;">
<a href="Welcome.dc.html" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 2px; min-height: 44px; margin-left: -8px; text-decoration: none; color: var(--link);">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"></path></svg>
Back
</a>
<div style="display: flex; flex-direction: column; gap: 6px;">
<p style="margin: 0; font-size: 14px; line-height: 20px; color: var(--label-secondary);">Step 1 of 3</p>
<h1 style="margin: 0; font-family: var(--font-display); font-size: 32px; line-height: 36px; font-weight: 600; letter-spacing: 0.004em;">Name your house</h1>
<p style="margin: 0; color: var(--label-secondary);">Everyone who joins will see this name.</p>
</div>
<x-import component-from-global-scope="Lumen.TextField" label="House name" default-value="Elm Road" helper="You can change it later in House settings." class-name="field-full"></x-import>
<section aria-label="What happens next" style="background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); padding: 16px 20px; display: flex; flex-direction: column; gap: 8px;">
<span style="font-weight: 600;">Next, you’ll get an invite code</span>
<span style="font-size: 14px; line-height: 20px; letter-spacing: -0.016em; color: var(--label-secondary);">Share it with your housemates so they can join. You can find it any time in the House tab.</span>
</section>
</main>
<footer style="flex: none; padding: 12px 24px 40px; display: flex; flex-direction: column;">
<x-import component-from-global-scope="Lumen.Button" variant="primary" size="large" class-name="btn-block" href="Profile.dc.html">Continue</x-import>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Theme"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { themeClass: this.props.dark ? 'lm-dark' : 'lm-light' };
  }
}
</script>
</body>
</html>
