<body>
<x-dc>

<div class="{{themeClass}}" style="width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden; background: var(--bg-alt); color: var(--label); font-family: var(--font-text); font-size: 17px; line-height: 25px; letter-spacing: -0.022em; -webkit-font-smoothing: antialiased;">

</div>
<div style="background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); padding: 14px 16px; display: flex; align-items: center; gap: 12px; margin-left: 20px;">
<span style="width: 32px; height: 32px; border-radius: 50%; background: var(--av-leo); color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;">L</span>
<span style="flex: 1 1 auto; display: flex; flex-direction: column;"><span style="font-weight: 600;">Clean bathroom</span><span style="font-size: 14px; line-height: 20px; color: var(--label-secondary);">Leo is next · Tuesday</span></span>

<div style="background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); padding: 14px 16px; display: flex; align-items: center; gap: 12px;">
<span style="width: 32px; height: 32px; border-radius: 50%; background: var(--av-raj); color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;">R</span>
<span style="flex: 1 1 auto; display: flex; flex-direction: column;"><span style="font-weight: 600;">Tesco shop</span><span style="font-size: 14px; line-height: 20px; color: var(--label-secondary);">Raj paid · split 4 ways</span></span>

<x-import component-from-global-scope="Lumen.Button" variant="secondary" size="large" class-name="btn-block" href="JoinHouse.dc.html">Join with a code</x-import>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Theme"},"$preview":{"width":390,"height":844}}'>

  renderVals() {
    return { themeClass: this.props.dark ? 'lm-dark' : 'lm-light' };
  }
}
</script>
