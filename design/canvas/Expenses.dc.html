<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Expenses</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="ds/lumen/components/bundle.css">
<script src="ds/lumen/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--link)}a:hover{color:var(--link)}
button:focus-visible,a:focus-visible{outline:3px solid var(--focus-ring);outline-offset:1px}
</style>
</helmet>
<div class="{{themeClass}}" style="width: 390px; height: 1000px; display: flex; flex-direction: column; overflow: hidden; background: var(--bg-alt); color: var(--label); font-family: var(--font-text); font-size: 17px; line-height: 25px; letter-spacing: -0.022em; -webkit-font-smoothing: antialiased;">
<main style="flex: 1 1 auto; min-height: 0; overflow-y: auto; box-sizing: border-box; padding: 58px 16px 24px; display: flex; flex-direction: column; gap: 12px;">

<header style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 6px 4px;">
<h1 style="margin: 0; font-family: var(--font-display); font-size: 32px; line-height: 36px; font-weight: 600; letter-spacing: 0.004em;">Expenses</h1>
<a href="AddExpense.dc.html" aria-label="Add an expense" style="width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: flex; align-items: center; justify-content: center;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
</a>
</header>

<sc-if value="{{owing}}" hint-placeholder-val="{{true}}">
<section aria-label="Your balance" style="background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); padding: 18px 20px 6px; display: flex; flex-direction: column;">
<span style="font-size: 14px; line-height: 20px; color: var(--label-secondary);">You owe</span>
<span style="font-family: var(--font-display); font-size: 40px; line-height: 44px; font-weight: 600;">£22.60</span>
<span style="font-size: 14px; line-height: 20px; letter-spacing: -0.016em; color: var(--label-secondary); padding-bottom: 10px;">Simplified so the house makes the fewest payments.</span>
<ul aria-label="Who owes whom" style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column;">
<sc-for list="{{debts}}" as="d" hint-placeholder-count="3">
<li style="display: flex; align-items: center; gap: 10px; min-height: 60px; border-top: 1px solid var(--separator);">
<span aria-hidden="true" style="display: flex; align-items: center; gap: 4px; color: var(--label-tertiary);">
<span style="width: 28px; height: 28px; border-radius: 50%; background: var(--av-maya); color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600;">M</span>
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M14 6.5l5.5 5.5-5.5 5.5"></path></svg>
<span style="width: 28px; height: 28px; border-radius: 50%; background: {{d.c}}; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600;">{{d.i}}</span>
</span>
<span style="flex: 1 1 auto; display: flex; flex-direction: column;">
<span>You owe {{d.name}}</span>
<span style="font-weight: 600;">{{d.amount}}</span>
</span>
<x-import component-from-global-scope="Lumen.Button" variant="secondary" size="small" href="SettleUp.dc.html">Settle up</x-import>
</li>
</sc-for>
</ul>
</section>
</sc-if>

<sc-if value="{{settled}}" hint-placeholder-val="{{false}}">
<section aria-label="Your balance" style="background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); padding: 28px 24px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px;">
<span aria-hidden="true" style="width: 56px; height: 56px; border-radius: 50%; background: var(--success-tint); color: var(--success); display: flex; align-items: center; justify-content: center; margin-bottom: 8px;">
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg>
</span>
<h2 style="margin: 0; font-family: var(--font-display); font-size: 28px; line-height: 32px; font-weight: 600; letter-spacing: 0.007em;">All settled up.</h2>
<p style="margin: 0; color: var(--label-secondary);">Nobody in the house owes anyone right now.</p>
</section>
</sc-if>

<section aria-labelledby="ex-recent" style="background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); padding: 16px 16px 4px; display: flex; flex-direction: column;">
<h2 id="ex-recent" style="margin: 0 0 4px; font-family: var(--font-display); font-size: 24px; line-height: 28px; font-weight: 600; letter-spacing: 0.009em;">Recent</h2>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column;">
<sc-for list="{{items}}" as="e" hint-placeholder-count="6">
<li style="border-top: {{e.border}};">
<a href="{{e.href}}" style="display: flex; align-items: center; gap: 12px; min-height: 64px; text-decoration: none; color: inherit;">
<span aria-hidden="true" style="flex: none; width: 36px; height: 36px; border-radius: 50%; background: {{e.c}}; color: {{e.ic}}; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;">{{e.i}}</span>
<span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column;">
<span style="font-weight: 600;">{{e.title}}</span>
<span style="display: flex; align-items: center; gap: 5px; font-size: 14px; line-height: 20px; letter-spacing: -0.016em; color: var(--label-secondary);">
<span>{{e.meta}}</span>
<sc-if value="{{e.recurring}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-label="Monthly bill"><path d="m17 2.5 3 3-3 3"></path><path d="M4 11.5v-2a4 4 0 0 1 4-4h12"></path><path d="m7 21.5-3-3 3-3"></path><path d="M20 12.5v2a4 4 0 0 1-4 4H4"></path></svg></sc-if>
</span>
</span>
<span style="flex: none; display: flex; flex-direction: column; align-items: flex-end;">
<span style="font-weight: 600;">{{e.amount}}</span>
<span style="font-size: 12px; line-height: 16px; color: var(--label-secondary);">{{e.mine}}</span>
</span>
</a>
</li>
</sc-for>
</ul>
</section>

</main>

<nav aria-label="Main" style="flex: none; height: 83px; box-sizing: border-box; padding: 6px 8px 34px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--nav-glass); -webkit-backdrop-filter: var(--blur-glass); backdrop-filter: var(--blur-glass); border-top: 1px solid var(--separator);">
<a href="Today.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 44px; text-decoration: none; color: var(--label-secondary); font-size: 12px; line-height: 16px;">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path><circle cx="12" cy="15" r="1.5"></circle></svg>
<span>Today</span>
</a>
<a href="Chores.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 44px; text-decoration: none; color: var(--label-secondary); font-size: 12px; line-height: 16px;">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 7 2 2 3.5-3.5M12 7.5h8M4 16l2 2 3.5-3.5M12 16.5h8"></path></svg>
<span>Chores</span>
</a>
<a href="Expenses.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 44px; text-decoration: none; color: var(--link); font-size: 12px; line-height: 16px; font-weight: 600;">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5h12v17l-2-1.5-2 1.5-2-1.5-2 1.5-2-1.5-2 1.5z"></path><path d="M9 8.5h6M9 12h6M9 15.5h3"></path></svg>
<span>Expenses</span>
</a>
<a href="House.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 44px; text-decoration: none; color: var(--label-secondary); font-size: 12px; line-height: 16px;">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20H4z"></path><path d="M10 20v-5h4v5"></path></svg>
<span>House</span>
</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Theme"},"settled":{"editor":"boolean","default":false,"section":"State"},"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const settled = !!this.props.settled;
    const P = {
      maya: { i: 'M', c: 'var(--av-maya)', ic: '#ffffff' },
      sam: { i: 'S', c: 'var(--av-sam)', ic: '#ffffff' },
      raj: { i: 'R', c: 'var(--av-raj)', ic: '#ffffff' },
      leo: { i: 'L', c: 'var(--av-leo)', ic: '#ffffff' }
    };
    const settledRows = [
      { who: 'maya', title: 'You paid Leo back', meta: 'Today · Bank transfer', amount: '£9.60', mine: 'Settled' },
      { who: 'maya', title: 'You paid Sam back', meta: 'Today · Cash', amount: '£7.80', mine: 'Settled' },
      { who: 'maya', title: 'You paid Raj back', meta: 'Today · Bank transfer', amount: '£5.20', mine: 'Settled' }
    ];
    const base = [
      { who: 'raj', title: 'Tesco shop', meta: 'Raj paid · Yesterday', amount: '£42.60', mine: 'your share £10.65' },
      { who: 'sam', title: 'Pizza night', meta: 'Sam paid · Sat 3 Oct · not Leo', amount: '£36.00', mine: 'your share £12.00' },
      { who: 'sam', title: 'Toilet roll and bin bags', meta: 'Sam paid · Fri 2 Oct', amount: '£9.20', mine: 'your share £2.30' },
      { who: 'maya', title: 'Cleaning supplies', meta: 'You paid · Thu 1 Oct', amount: '£14.80', mine: 'you lent £11.10' },
      { who: 'leo', title: 'Broadband', meta: 'Leo paid · Thu 1 Oct', amount: '£35.00', mine: 'your share £8.75', recurring: true },
      { who: 'leo', title: 'Leo paid you back', meta: 'Mon 28 Sep · Cash', amount: '£6.00', mine: 'Settled' }
    ];
    const rows = (settled ? settledRows.concat(base) : base).map((e, i) => Object.assign({ recurring: false }, e, P[e.who], {
      border: i === 0 ? 'none' : '1px solid var(--separator)',
      href: e.mine === 'Settled' ? 'ActivityHistory.dc.html' : 'ExpenseDetail.dc.html'
    }));
    return {
      themeClass: this.props.dark ? 'lm-dark' : 'lm-light',
      owing: !settled,
      settled: settled,
      debts: [
        { name: 'Leo', i: 'L', c: 'var(--av-leo)', amount: '£9.60' },
        { name: 'Sam', i: 'S', c: 'var(--av-sam)', amount: '£7.80' },
        { name: 'Raj', i: 'R', c: 'var(--av-raj)', amount: '£5.20' }
      ],
      items: rows
    };
  }
}
</script>
</body>
</html>
